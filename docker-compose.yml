# Local MySQL only (ADR-038). The backend and the frontend still run with pnpm.
#
#   docker compose --env-file backend/.env up -d     # start (port LOCAL_DB_PORT, default 3306)
#   docker compose --env-file backend/.env down      # stop; add -v to delete the data
#
# backend/.env must have LOCAL_DB_USER=root and the LOCAL_DB_PASSWORD you choose.
# If you already run MySQL on 3306, set LOCAL_DB_PORT=3307 in backend/.env.
services:
  mysql:
    image: mysql:8.0
    container_name: four-points-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in backend/.env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      # Only this machine can reach it
      - '127.0.0.1:${LOCAL_DB_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 5s
      retries: 20

volumes:
  mysql-data:

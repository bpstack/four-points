<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Horarios - Demo Interactiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .employees-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .employee-tag {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .employee-tag button {
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .schedule-container {
            padding: 30px;
            overflow-x: auto;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        .schedule-table th {
            background: #495057;
            color: white;
            padding: 12px 8px;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .schedule-table td {
            padding: 10px 8px;
            text-align: center;
            border: 1px solid #dee2e6;
        }

        .schedule-table tr:nth-child(even) {
            background: #f8f9fa;
        }

        .schedule-table .employee-name {
            font-weight: 600;
            text-align: left;
            background: #e9ecef;
            position: sticky;
            left: 0;
            z-index: 5;
        }

        .turno-M { background: #FFE082; color: #000; font-weight: bold; }
        .turno-T { background: #81C784; color: #000; font-weight: bold; }
        .turno-N { background: #64B5F6; color: #000; font-weight: bold; }
        .turno-L { background: #BDBDBD; color: #666; }
        .turno-V { background: #FFB74D; color: #000; font-weight: bold; }
        .turno-P { background: #9575CD; color: white; font-weight: bold; }

        .stats {
            padding: 30px;
            background: #f8f9fa;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #495057;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .validation {
            padding: 20px 30px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .alert-warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            color: #856404;
        }

        .alert-success {
            background: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
        }

        .legend {
            padding: 20px 30px;
            background: #f8f9fa;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 40px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .control-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗓️ Generador de Horarios</h1>
            <p>Sistema automático de planificación laboral para hoteles</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="form-group">
                    <label>Mes:</label>
                    <select id="mes">
                        <option value="1" selected>Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Septiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Año:</label>
                    <input type="number" id="anio" value="2025" min="2024" max="2030">
                </div>
            </div>

            <div class="form-group">
                <label>Agregar Empleado:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="nombreEmpleado" placeholder="Nombre del empleado">
                    <button class="btn" onclick="agregarEmpleado()" style="padding: 10px 20px;">+ Agregar</button>
                </div>
            </div>

            <div class="employees-list" id="empleadosList">
                <div class="employee-tag">
                    EMP_01 <button onclick="eliminarEmpleado('EMP_01')">×</button>
                </div>
                <div class="employee-tag">
                    EMP_02 <button onclick="eliminarEmpleado('EMP_02')">×</button>
                </div>
                <div class="employee-tag">
                    EMP_03 <button onclick="eliminarEmpleado('EMP_03')">×</button>
                </div>
                <div class="employee-tag">
                    EMP_04 <button onclick="eliminarEmpleado('EMP_04')">×</button>
                </div>
            </div>

            <button class="btn" onclick="generarHorario()" style="width: 100%; font-size: 1.3em;">
                🚀 Generar Horario Automáticamente
            </button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color turno-M">M</div>
                <span>Mañana (7-15h)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color turno-T">T</div>
                <span>Tarde (15-23h)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color turno-N">N</div>
                <span>Noche (23-7h)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color turno-L">L</div>
                <span>Libre</span>
            </div>
            <div class="legend-item">
                <div class="legend-color turno-V">V</div>
                <span>Vacaciones</span>
            </div>
        </div>

        <div id="resultado"></div>
    </div>

    <script>
        let empleados = ['EMP_01', 'EMP_02', 'EMP_03', 'EMP_04'];

        function agregarEmpleado() {
            const nombre = document.getElementById('nombreEmpleado').value.trim().toUpperCase();
            if (nombre && !empleados.includes(nombre)) {
                empleados.push(nombre);
                actualizarListaEmpleados();
                document.getElementById('nombreEmpleado').value = '';
            }
        }

        function eliminarEmpleado(nombre) {
            empleados = empleados.filter(e => e !== nombre);
            actualizarListaEmpleados();
        }

        function actualizarListaEmpleados() {
            const lista = document.getElementById('empleadosList');
            lista.innerHTML = empleados.map(emp => `
                <div class="employee-tag">
                    ${emp} <button onclick="eliminarEmpleado('${emp}')">×</button>
                </div>
            `).join('');
        }

        function generarHorario() {
            const mes = parseInt(document.getElementById('mes').value);
            const anio = parseInt(document.getElementById('anio').value);
            
            if (empleados.length === 0) {
                alert('Agrega al menos un empleado');
                return;
            }

            document.getElementById('resultado').innerHTML = '<div class="loading">⏳ Generando horario...</div>';

            setTimeout(() => {
                const resultado = generarHorarioLogic(mes, anio, empleados);
                mostrarResultado(resultado, mes, anio);
            }, 500);
        }

        function generarHorarioLogic(mes, anio, empleados) {
            const diasDelMes = new Date(anio, mes, 0).getDate();
            const horario = {};
            
            // Inicializar horario
            empleados.forEach(emp => {
                horario[emp] = new Array(diasDelMes).fill(null);
            });

            // Generar turnos
            const turnosDisponibles = ['M', 'T', 'N'];
            
            for (let dia = 1; dia <= diasDelMes; dia++) {
                const fecha = new Date(anio, mes - 1, dia);
                const diaSemana = fecha.getDay();
                const esFinDeSemana = diaSemana === 0 || diaSemana === 6;
                
                const necesidades = esFinDeSemana ? { M: 2, T: 2, N: 1 } : { M: 1, T: 1, N: 1 };
                let turnosAsignados = { M: 0, T: 0, N: 0 };
                
                // Ordenar empleados aleatoriamente para variar
                const empleadosAleatorios = [...empleados].sort(() => Math.random() - 0.5);
                
                for (const empleado of empleadosAleatorios) {
                    if (horario[empleado][dia - 1]) continue;
                    
                    // Verificar si puede trabajar
                    if (!puedeTrabajar(horario[empleado], dia)) {
                        horario[empleado][dia - 1] = 'L';
                        continue;
                    }
                    
                    // Asignar turno
                    const turnosNecesarios = turnosDisponibles.filter(t => turnosAsignados[t] < necesidades[t]);
                    if (turnosNecesarios.length > 0) {
                        const turno = turnosNecesarios[Math.floor(Math.random() * turnosNecesarios.length)];
                        horario[empleado][dia - 1] = turno;
                        turnosAsignados[turno]++;
                    } else {
                        horario[empleado][dia - 1] = 'L';
                    }
                }
            }

            return {
                horario,
                estadisticas: calcularEstadisticas(horario),
                validacion: validarHorario(horario)
            };
        }

        function puedeTrabajar(turnos, dia) {
            if (dia > 5) {
                const ultimosCincoDias = turnos.slice(dia - 6, dia - 1);
                const todosTrabajando = ultimosCincoDias.every(t => t && t !== 'L' && t !== 'V');
                if (todosTrabajando) return false;
            }
            
            if (dia > 1 && turnos[dia - 2] === 'N') {
                return false;
            }
            
            return true;
        }

        function calcularEstadisticas(horario) {
            const stats = {};
            for (const [empleado, turnos] of Object.entries(horario)) {
                const conteo = { M: 0, T: 0, N: 0 };
                let horas = 0;
                let diasTrabajados = 0;
                let diasLibres = 0;
                
                turnos.forEach(t => {
                    if (conteo.hasOwnProperty(t)) {
                        conteo[t]++;
                        horas += 8;
                        diasTrabajados++;
                    } else if (t === 'L') {
                        diasLibres++;
                    }
                });
                
                stats[empleado] = { horas, diasTrabajados, diasLibres, turnos: conteo };
            }
            return stats;
        }

        function validarHorario(horario) {
            const advertencias = [];
            for (const [empleado, turnos] of Object.entries(horario)) {
                let consecutivos = 0;
                for (let i = 0; i < turnos.length; i++) {
                    if (turnos[i] && turnos[i] !== 'L') {
                        consecutivos++;
                        if (consecutivos > 5) {
                            advertencias.push(`${empleado} trabaja ${consecutivos} días seguidos en día ${i + 1}`);
                        }
                    } else {
                        consecutivos = 0;
                    }
                }
            }
            return advertencias;
        }

        function mostrarResultado(resultado, mes, anio) {
            const { horario, estadisticas, validacion } = resultado;
            const empleadosList = Object.keys(horario);
            const diasDelMes = horario[empleadosList[0]].length;
            const nombresMeses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            
            let html = `
                <div class="schedule-container">
                    <h2 style="margin-bottom: 20px; color: #495057;">📅 ${nombresMeses[mes - 1]} ${anio}</h2>
                    <table class="schedule-table">
                        <thead>
                            <tr>
                                <th>EMPLEADO</th>
                                ${Array.from({ length: diasDelMes }, (_, i) => `<th>${i + 1}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            for (const empleado of empleadosList) {
                html += `<tr><td class="employee-name">${empleado}</td>`;
                for (const turno of horario[empleado]) {
                    const clase = turno ? `turno-${turno}` : '';
                    html += `<td class="${clase}">${turno || '-'}</td>`;
                }
                html += '</tr>';
            }
            
            html += '</tbody></table></div>';
            
            // Estadísticas
            html += '<div class="stats">';
            for (const [empleado, stats] of Object.entries(estadisticas)) {
                html += `
                    <div class="stat-card">
                        <h3>${empleado}</h3>
                        <div class="stat-item">
                            <span>Horas totales:</span>
                            <strong>${stats.horas}h</strong>
                        </div>
                        <div class="stat-item">
                            <span>Días trabajados:</span>
                            <strong>${stats.diasTrabajados}</strong>
                        </div>
                        <div class="stat-item">
                            <span>Días libres:</span>
                            <strong>${stats.diasLibres}</strong>
                        </div>
                        <div class="stat-item">
                            <span>Mañanas/Tardes/Noches:</span>
                            <strong>${stats.turnos.M}/${stats.turnos.T}/${stats.turnos.N}</strong>
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            
            // Validación
            html += '<div class="validation">';
            if (validacion.length === 0) {
                html += '<div class="alert alert-success">✅ Horario válido sin problemas detectados</div>';
            } else {
                validacion.forEach(adv => {
                    html += `<div class="alert alert-warning">⚠️ ${adv}</div>`;
                });
            }
            html += '</div>';
            
            document.getElementById('resultado').innerHTML = html;
        }
    </script>
</body>
</html>
